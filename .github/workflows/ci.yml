name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms rather than hiding one behind the other's failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Style is settled by the tool, not in review. .editorconfig is the source of truth.
      # Only needs checking once, so it is pinned to the Linux leg.
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The deep perft runs are excluded here by default.runsettings; they have
      # their own workflow because they take minutes rather than seconds.
      - name: Test
        run: dotnet test --configuration Release --no-build
